[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Production-grade AI customer support agent for AppleSupport with evaluation harness and LLM-as-a-judge"
authors = [{ name = "Candidate" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1.0",
    "pydantic>=2.5.0",
    "google-genai>=1.0.0",
    "groq>=0.11.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.66.0",
    "pytest>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
